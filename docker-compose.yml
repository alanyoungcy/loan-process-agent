  # Camunda DMN Service (replaces drools-service)
  camunda-dmn-service:
    build:
      context: ./camunda-service
      dockerfile: Dockerfile
    container_name: loan-agent-camunda-dmn
    ports:
      - "8081:8081"
    networks:
      - loan-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/rules/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  chromadb_data:
  elasticsearch_data:
  zeebe_data:

networks:
  loan-agent-network:
    driver: bridge
